[graph]
all-features = true

[advisories]
version = 2
# Transitive unmaintained crates (egui/winit/zbus stack) are not actionable here;
# only flag unmaintained direct dependencies.
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "OFL-1.1",
    "BSL-1.0",
    "Ubuntu-font-1.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
